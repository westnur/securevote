<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecureVote — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="container">
      <a href="/" class="logo"><span class="logo-mark">✓</span> SecureVote</a>
      <div class="nav-links">
        <a href="/explorer">Ledger</a>
        <span id="nav-user" class="muted hidden"></span>
        <button id="logout" class="btn btn-outline btn-sm hidden">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="container app-wrap">
    <!-- Login -->
    <div id="login-view" class="login-box hidden">
      <form id="login-form" class="card">
        <h2>Sign in to SecureVote</h2>
        <p class="muted" style="margin-top:-4px">Access your organization's voting workspace.</p>
        <div id="login-msg"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required /></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required /></div>
        <button class="btn" style="width:100%">Sign in</button>
      </form>
      <div class="card demo-accounts" style="margin-top:16px">
        <strong>Demo accounts</strong>
        <p class="muted" style="margin:4px 0 6px">Click to fill in credentials:</p>
        <button class="btn btn-outline btn-sm demo" data-email="admin@securevote.io" data-pass="admin123">Admin (secretary)</button>
        <button class="btn btn-outline btn-sm demo" data-email="alice@securevote.io" data-pass="demo123">Alice · 5,000 shares</button>
        <button class="btn btn-outline btn-sm demo" data-email="bob@securevote.io" data-pass="demo123">Bob · 3,000 shares</button>
        <button class="btn btn-outline btn-sm demo" data-email="carol@securevote.io" data-pass="demo123">Carol · 2,000 shares</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dash-view" class="hidden">
      <div class="grid grid-3" style="margin-bottom:24px" id="summary"></div>
      <div class="tabs" id="tabs"></div>
      <div id="tab-content"></div>
    </div>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
